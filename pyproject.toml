[project]
name = "ai-pr-review"
version = "0.1.0"
description = "CLI MVP for AI-assisted GitHub Pull Request review"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "unidiff>=0.7",
  "openai>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
ai-pr-review = "ai_pr_review.cli:entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
